query ListArticles($limit: Int, $query: String) {
  articles(first: $limit, query: $query) {
    edges {
      node {
        id
        title
        handle
        author { name }
        publishedAt
        tags
        summary
        isPublished
        blog {
          id
          title
          handle
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
